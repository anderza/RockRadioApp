name: Сборка RockRadioNet iOS (IPA)

# Запускается, когда в корень репозитория загружен архив *iOS*.zip (или этот файл изменён),
# а также вручную: Actions → «Сборка RockRadioNet iOS (IPA)» → Run workflow.
on:
  push:
    paths:
      - "*iOS*.zip"
      - "*ios*.zip"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    name: iPhone и iPad (IPA без подписи)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Распаковать проект
        run: |
          echo "Файлы в репозитории:"; ls -la
          if [ -f RockRadioNet-iOS.zip ]; then Z=RockRadioNet-iOS.zip; else Z=$(ls *[iI][oO][sS]*.zip 2>/dev/null | head -1); fi
          if [ -z "$Z" ]; then echo "::error::Не найден архив iOS (*iOS*.zip) в корне репозитория"; exit 1; fi
          echo "Распаковываю: $Z"
          unzip -q "$Z" -d src
          D=$(dirname "$(find src -name project.yml | head -1)")
          if [ -z "$D" ] || [ "$D" = "." ]; then echo "::error::В архиве нет проекта iOS (project.yml)"; exit 1; fi
          echo "PROJ=$D" >> "$GITHUB_ENV"

      - name: Создать проект Xcode
        run: |
          brew install xcodegen
          cd "$PROJ" && xcodegen generate

      - name: Собрать приложение
        run: |
          cd "$PROJ"
          xcodebuild -version
          xcodebuild -project RockRadioNet.xcodeproj -target RockRadioNet -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build

      - name: Упаковать IPA
        run: |
          cd "$PROJ"
          APP=$(find build -maxdepth 3 -name "RockRadioNet.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "::error::Не найдено собранное приложение RockRadioNet.app"; exit 1; fi
          echo "Приложение: $APP"; ls "$APP" | head -50
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/RockRadioNet.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/RockRadioNet.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: RockRadioNet-IPA
          path: RockRadioNet.ipa

      - name: Выложить в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "ios-${{ github.run_number }}-${{ github.run_attempt }}" RockRadioNet.ipa --repo "${{ github.repository }}" --title "RockRadioNet для iPhone и iPad — сборка ${{ github.run_number }}" --notes "Скачайте RockRadioNet.ipa и установите на iPhone или iPad через Sideloadly (см. инструкцию)."
