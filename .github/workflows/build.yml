name: Сборка RockRadioNet Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Распаковать проект
        run: |
          echo "Файлы в репозитории:"; ls -la
          Z=$(ls *[Aa]ndroid*.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then echo "::error::Не найден архив Android (*Android*.zip) в корне репозитория"; exit 1; fi
          echo "Распаковываю: $Z"
          unzip -q "$Z" -d src
          D=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          if [ -z "$D" ] || [ "$D" = "." ]; then echo "::error::В архиве нет проекта Android"; exit 1; fi
          echo "PROJ=$D" >> "$GITHUB_ENV"
      - name: Собрать APK
        run: cd "$PROJ" && gradle assembleRelease --no-daemon --stacktrace
      - name: Подготовить файл
        run: cp "$PROJ"/app/build/outputs/apk/release/*.apk RockRadioNet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RockRadioNet-APK
          path: RockRadioNet.apk
      - name: Выложить в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "android-${{ github.run_number }}-${{ github.run_attempt }}" RockRadioNet.apk --repo "${{ github.repository }}" --title "RockRadioNet для Android — сборка ${{ github.run_number }}" --notes "Скачайте RockRadioNet.apk и установите на телефон или телевизор."
